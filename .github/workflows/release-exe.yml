name: Fabriquer l'exe Windows

# Ce fichier fabrique automatiquement l'installateur Windows (.exe)
# et le dépose dans la release GitHub correspondante.
#
# Il se déclenche de deux façons :
#   1. quand vous publiez une release sur GitHub (cas normal) ;
#   2. à la main, depuis l'onglet Actions (cas de rattrapage).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version à fabriquer (exemple : v1.0.4)"
        required: true

# Autorise ce travail à ajouter un fichier à la release
permissions:
  contents: write

jobs:
  build-exe:
    # Un ordinateur Windows prêté par GitHub
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Récupérer le code de cette version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le numéro de version est cohérent
        shell: bash
        run: |
          VERSION_PACKAGE=$(node -p "JSON.parse(fs.readFileSync('package.json','utf8')).version")
          VERSION_TAG="${TAG#v}"
          echo "Version dans package.json : $VERSION_PACKAGE"
          echo "Version de la release     : $VERSION_TAG"
          if [ "$VERSION_PACKAGE" != "$VERSION_TAG" ]; then
            echo "ERREUR : le numero dans package.json ne correspond pas a la release."
            echo "Corrigez la ligne version dans package.json, puis recreez la release."
            exit 1
          fi

      - name: Installer les dépendances
        shell: bash
        run: npm ci || npm install

      - name: Fabriquer l'installateur
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build-exe

      - name: Déposer l'exe dans la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXE=$(find dist release -name "CV Improvement Setup*.exe" 2>/dev/null | head -n 1)
          if [ -z "$EXE" ]; then
            echo "ERREUR : installateur introuvable apres la fabrication."
            exit 1
          fi
          echo "Fichier trouve : $EXE"
          gh release upload "$TAG" "$EXE" --clobber --repo "$GITHUB_REPOSITORY"
